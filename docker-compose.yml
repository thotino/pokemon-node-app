services:
  elasticsearch: 
    image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:9.5.6
    container_name: pokeindex
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    mem_limit: 1g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/var/lib/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 3001
      POKE_STORE_URL: http://elasticsearch:9200
      CHATBOT_URL: https://app.getvirtualbrain.com/
      WORKING_DIR: /tmp
    ports:
      - "3001:3001"
    volumes:
      - api_exports:/app/tmp/
    depends_on:
      elasticsearch:
        condition: service_healthy
  web:
    build: ./web-app
    ports:
      - "5173:8080"
    depends_on:
      - api
  indexer:
    build: ./indexer
    profiles:
      - "indexing"
    environment:
      POKE_STORE_URL: http://elasticsearch:9200
      POKE_API_URL: https://pokeapi.co/api/v2
    depends_on:
      elasticsearch:
        condition: service_healthy
volumes:
  esdata:
  api_exports:
    